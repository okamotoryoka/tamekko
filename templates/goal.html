{% extends 'base.html' %}{% block title %}貯金の目標{% endblock %}{% block body %}<header class="page-header"><button onclick="history.back()">‹</button><h1>貯金の目標</h1><span></span></header><main class="screen"><section class="goal-visual">🎮 ⭐<h2>{{account.goal_name or '新しい目標を決めよう！'}}</h2></section><section class="goal-card big"><small>目標金額</small><strong>{{'{:,}'.format(account.goal_amount or 0)}}円</strong><div class="progress"><i style="width:{{ [100, (account.balance*100/account.goal_amount if account.goal_amount else 0)]|min }}%"></i></div><p>{{'{:,}'.format(account.balance)}} / {{'{:,}'.format(account.goal_amount or 0)}}円</p></section><form method="post" class="cute-form"><label>目標の名前</label><input name="goal_name" value="{{account.goal_name or ''}}" placeholder="ゲーム機" required><label>目標金額</label><div class="money-input"><input type="number" name="goal_amount" value="{{account.goal_amount or ''}}" min="1" required><span>円</span></div><button class="primary pink-btn">目標を保存する</button></form><a class="outline-btn" href="/ai">🤖 AIの応援を見る</a></main>{% endblock %}
