{% extends 'base.html' %}{% block title %}親管理{% endblock %}{% block body %}<header class="page-header"><button onclick="history.back()">‹</button><h1>親管理</h1><span></span></header><main class="screen"><div class="seg-tabs"><button class="on">入金承認</button><button>設定</button><button>利用履歴</button></div><h3 class="section-title">承認待ちの入金</h3><div class="pending-list">{% for d in pending %}<section class="pending-card"><div><small>{{d.date}}</small><b>{{'{:,}'.format(d.amount)}}円</b><span>{{d.status}}</span></div><div class="approval"><form method="post" action="/parent/approve/{{d.id}}"><button class="approve">承認</button></form><form method="post" action="/parent/reject/{{d.id}}"><button class="reject">非承認</button></form></div></section>{% else %}<div class="empty">承認待ちの入金はありません 🌼</div>{% endfor %}</div><div class="link-list"><a href="/settings/pin/allowance"><span>💰</span><div><b>お小遣い設定</b><small>月 {{'{:,}'.format(account.allowance)}}円</small></div><em>›</em></a><a href="/history"><span>📊</span><div><b>利用履歴を確認</b></div><em>›</em></a><a href="/history/csv"><span>📄</span><div><b>帳簿を出力（CSV）</b></div><em>›</em></a></div></main>{% endblock %}
