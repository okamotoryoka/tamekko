{% extends "base.html" %}

{% block title %}ログイン{% endblock %}

{% block nav %}{% endblock %}

{% block body %}

<section class="login-page">

    <div class="login-logo">
        🐾
    </div>

    <h1>
        ためっこ
    </h1>

    <p>
        おこづかいを楽しく管理しよう！
    </p>


    <form method="POST">

        <label>
            ID
        </label>

        <input
            type="text"
            name="login_id"
            class="text-input"
            placeholder="IDを入力"
            required>


        <label>
            パスワード
        </label>

        <input
            type="password"
            name="password"
            class="text-input"
            placeholder="パスワード"
            required>


        <button
            type="submit"
            class="main-button">

            ログイン

        </button>

    </form>

</section>

{% endblock %}
